<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Dashboard & Feedback</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background-color: #f8f9fa; }
    .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card-title { font-weight: 600; }
    .star-rating { font-size: 2rem; cursor: pointer; color: #ddd; }
    .star-rating .highlight,
    .star-rating .selected { color: gold; }
</style>
</head>
<body>
<div class="container mt-5">

    <!-- Dashboard -->
    <h2 class="mb-4">CRM Dashboard</h2>
    <div class="row mb-5" id="dashboard-cards">
        <!-- Cards injected by JS -->
    </div>

    <!-- Feedback Form -->
    <h2 class="mb-4">Feedback & Rating</h2>
    <form id="feedback-form" class="mb-4">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="customerName" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Feedback</label>
            <textarea class="form-control" id="message" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Rating</label>
            <div id="star-rating" class="star-rating">
                <span data-value="1">★</span>
                <span data-value="2">★</span>
                <span data-value="3">★</span>
                <span data-value="4">★</span>
                <span data-value="5">★</span>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <!-- Feedback List -->
    <h4>All Feedback</h4>
    <ul class="list-group" id="feedback-list"></ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let selectedRating = 0;
const stars = document.querySelectorAll('#star-rating span');

// Hover and click behavior for stars
stars.forEach(star => {
    star.addEventListener('mouseover', () => {
        const val = parseInt(star.getAttribute('data-value'));
        stars.forEach(s => s.classList.remove('highlight'));
        for (let i = 0; i < val; i++) stars[i].classList.add('highlight');
    });

    star.addEventListener('mouseout', () => {
        stars.forEach(s => s.classList.remove('highlight'));
        for (let i = 0; i < selectedRating; i++) stars[i].classList.add('selected');
    });

    star.addEventListener('click', () => {
        selectedRating = parseInt(star.getAttribute('data-value'));
        stars.forEach(s => s.classList.remove('selected'));
        for (let i = 0; i < selectedRating; i++) stars[i].classList.add('selected');
    });
});

// Load all feedback
async function loadFeedback() {
    const response = await fetch('/feedback/all');
    const feedbacks = await response.json();
    const list = document.getElementById('feedback-list');
    list.innerHTML = '';
    feedbacks.forEach(f => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.innerHTML = `<strong>${f.customerName}</strong> (${f.rating}⭐)<br>${f.message}`;
        list.appendChild(li);
    });
}

// Load dashboard stats including feedback
async function loadDashboardStats() {
    try {
        const [dashboardRes, feedbackRes] = await Promise.all([
            fetch('/dashboard/stats'),
            fetch('/feedback/stats')
        ]);
        const data = await dashboardRes.json();
        const feedbackData = await feedbackRes.json();

        const fullStars = Math.floor(feedbackData.averageRating);
        const halfStar = feedbackData.averageRating % 1 >= 0.5 ? 1 : 0;
        const emptyStars = 5 - fullStars - halfStar;
        const starsDisplay = '★'.repeat(fullStars) + (halfStar ? '⯪' : '') + '☆'.repeat(emptyStars);

        document.getElementById('dashboard-cards').innerHTML = `
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-primary h-100">
                    <div class="card-body">
                        <h5 class="card-title">Total Customers</h5>
                        <p class="card-text fs-2">${data.totalCustomers}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-success h-100">
                    <div class="card-body">
                        <h5 class="card-title">Total Bookings</h5>
                        <p class="card-text fs-2">${data.totalBookings}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-warning h-100">
                    <div class="card-body">
                        <h5 class="card-title">Total Revenue</h5>
                        <p class="card-text fs-2">₹ ${data.totalRevenue.toLocaleString()}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-white bg-info h-100">
                    <div class="card-body">
                        <h5 class="card-title">Average Rating</h5>
                        <p class="card-text fs-2">${starsDisplay} (${feedbackData.averageRating})</p>
                        <small>Total Feedbacks: ${feedbackData.totalFeedbacks}</small>
                    </div>
                </div>
            </div>
        `;
    } catch (error) {
        console.error('Error loading dashboard stats:', error);
    }
}

// Handle feedback form submission
document.getElementById('feedback-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (selectedRating === 0) {
        alert('Please select a rating!');
        return;
    }
    const feedback = {
        customerName: document.getElementById('customerName').value,
        message: document.getElementById('message').value,
        rating: selectedRating
    };
    await fetch('/feedback/submit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(feedback)
    });
    document.getElementById('feedback-form').reset();
    selectedRating = 0;
    stars.forEach(s => s.classList.remove('selected'));

    loadFeedback();
    loadDashboardStats(); // Update dashboard live
});

// Initial load
window.onload = () => {
    loadFeedback();
    loadDashboardStats();
};
</script>
</body>
</html>
