<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background-color: #f8f9fa; }
    .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 30px; }
    .card-title { font-weight: 600; }
    .star-rating { font-size: 1.8rem; cursor: pointer; color: #ddd; }
    .star-rating .highlight, .star-rating .selected { color: gold; }
</style>
</head>
<body>
<div class="container mt-5">

    <!-- DASHBOARD METRICS -->
    <h2 class="mb-4">CRM Dashboard</h2>
    <div class="row mb-5" id="dashboard-cards">
        <!-- Cards injected by JS -->
    </div>

    <hr>

    <!-- FEEDBACK & RATING -->
    <h2 class="mb-4">Feedback & Rating</h2>
    <form id="feedback-form" class="mb-4">
        <div class="mb-3"><label>Name</label><input type="text" id="customerName" class="form-control" required></div>
        <div class="mb-3"><label>Feedback</label><textarea id="message" class="form-control" rows="2" required></textarea></div>
        <div class="mb-3"><label>Rating</label>
            <div id="star-rating" class="star-rating">
                <span data-value="1">★</span><span data-value="2">★</span><span data-value="3">★</span><span data-value="4">★</span><span data-value="5">★</span>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit Feedback</button>
    </form>
    <h4>All Feedback</h4>
    <ul class="list-group mb-5" id="feedback-list"></ul>

    <hr>

    <!-- INVENTORY MANAGEMENT -->
    <h2 class="mb-4">Inventory Management</h2>
    <button class="btn btn-primary mb-3" onclick="showInventoryForm()">Add New Item</button>
    <table class="table table-bordered table-striped" id="inventory-table">
        <thead class="table-dark">
            <tr><th>ID</th><th>Name</th><th>Category</th><th>Quantity</th><th>Price (₹)</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <div id="inventory-form-container" style="display:none;" class="mb-4">
        <h5 id="inventory-form-title">Add Inventory Item</h5>
        <form id="inventory-form">
            <input type="hidden" id="inventoryId">
            <div class="mb-3"><label>Name</label><input type="text" id="inventoryName" class="form-control" required></div>
            <div class="mb-3"><label>Category</label><input type="text" id="inventoryCategory" class="form-control" required></div>
            <div class="mb-3"><label>Quantity</label><input type="number" id="inventoryQuantity" class="form-control" required></div>
            <div class="mb-3"><label>Price (₹)</label><input type="number" id="inventoryPrice" class="form-control" required></div>
            <button type="submit" class="btn btn-success">Save</button>
            <button type="button" class="btn btn-secondary" onclick="hideInventoryForm()">Cancel</button>
        </form>
    </div>

    <hr>

    <!-- OFFERS & DISCOUNTS -->
    <h2 class="mb-4">Offers & Discounts</h2>
    <button class="btn btn-primary mb-3" onclick="showOfferForm()">Add New Offer</button>
    <table class="table table-bordered table-striped" id="offers-table">
        <thead class="table-dark">
            <tr><th>ID</th><th>Name</th><th>Description</th><th>Discount %</th><th>Start Date</th><th>End Date</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <div id="offer-form-container" style="display:none;" class="mb-4">
        <h5 id="offer-form-title">Add Offer</h5>
        <form id="offer-form">
            <input type="hidden" id="offerId">
            <div class="mb-3"><label>Name</label><input type="text" id="offerName" class="form-control" required></div>
            <div class="mb-3"><label>Description</label><textarea id="offerDescription" class="form-control" rows="2" required></textarea></div>
            <div class="mb-3"><label>Discount %</label><input type="number" id="offerDiscount" class="form-control" required></div>
            <div class="mb-3"><label>Start Date</label><input type="date" id="offerStartDate" class="form-control" required></div>
            <div class="mb-3"><label>End Date</label><input type="date" id="offerEndDate" class="form-control" required></div>
            <button type="submit" class="btn btn-success">Save</button>
            <button type="button" class="btn btn-secondary" onclick="hideOfferForm()">Cancel</button>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// --------------- DASHBOARD ----------------
async function loadDashboardStats() {
    try {
        const [dataRes, feedbackRes] = await Promise.all([
            fetch('/dashboard/stats'),
            fetch('/feedback/stats')
        ]);
        const data = await dataRes.json();
        const feedbackData = await feedbackRes.json();

        const fullStars = Math.floor(feedbackData.averageRating);
        const halfStar = feedbackData.averageRating % 1 >= 0.5 ? 1 : 0;
        const emptyStars = 5 - fullStars - halfStar;
        const starsDisplay = '★'.repeat(fullStars) + (halfStar?'⯪':'') + '☆'.repeat(emptyStars);

        document.getElementById('dashboard-cards').innerHTML = `
        <div class="col-md-3 mb-3">
            <div class="card text-white bg-primary h-100"><div class="card-body"><h5 class="card-title">Total Customers</h5><p class="card-text fs-2">${data.totalCustomers}</p></div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-white bg-success h-100"><div class="card-body"><h5 class="card-title">Total Bookings</h5><p class="card-text fs-2">${data.totalBookings}</p></div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-white bg-warning h-100"><div class="card-body"><h5 class="card-title">Total Revenue</h5><p class="card-text fs-2">₹ ${data.totalRevenue.toLocaleString()}</p></div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-white bg-info h-100"><div class="card-body"><h5 class="card-title">Average Rating</h5><p class="card-text fs-2">${starsDisplay} (${feedbackData.averageRating})</p><small>Total Feedbacks: ${feedbackData.totalFeedbacks}</small></div></div>
        </div>`;
    } catch(e) { console.error(e); }
}

// --------------- FEEDBACK ----------------
let selectedRating = 0;
const stars = document.querySelectorAll('#star-rating span');
stars.forEach(star=>{
    star.addEventListener('mouseover',()=>{ const val=parseInt(star.dataset.value); stars.forEach(s=>s.classList.remove('highlight')); for(let i=0;i<val;i++) stars[i].classList.add('highlight'); });
    star.addEventListener('mouseout',()=>{ stars.forEach(s=>s.classList.remove('highlight')); for(let i=0;i<selectedRating;i++) stars[i].classList.add('selected'); });
    star.addEventListener('click',()=>{ selectedRating=parseInt(star.dataset.value); stars.forEach(s=>s.classList.remove('selected')); for(let i=0;i<selectedRating;i++) stars[i].classList.add('selected'); });
});

async function loadFeedback() {
    const res = await fetch('/feedback/all');
    const feedbacks = await res.json();
    const list = document.getElementById('feedback-list');
    list.innerHTML = '';
    feedbacks.forEach(f=>{ const li=document.createElement('li'); li.className='list-group-item'; li.innerHTML=`<strong>${f.customerName}</strong> (${f.rating}⭐)<br>${f.message}`; list.appendChild(li); });
}

document.getElementById('feedback-form').addEventListener('submit', async e=>{
    e.preventDefault();
    if(selectedRating===0){ alert('Please select a rating!'); return; }
    const feedback={ customerName:document.getElementById('customerName').value, message:document.getElementById('message').value, rating:selectedRating };
    await fetch('/feedback/submit',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(feedback) });
    document.getElementById('feedback-form').reset();
    selectedRating=0; stars.forEach(s=>s.classList.remove('selected'));
    loadFeedback();
    loadDashboardStats();
});

// --------------- INVENTORY ----------------
async function loadInventory() {
    const res = await fetch('/inventory/all');
    const items = await res.json();
    const tbody=document.querySelector('#inventory-table tbody');
    tbody.innerHTML='';
    items.forEach(i=>{ tbody.innerHTML+=`<tr><td>${i.id}</td><td>${i.name}</td><td>${i.category}</td><td>${i.quantity}</td><td>${i.price}</td><td><button class="btn btn-sm btn-warning" onclick="editInventory(${i.id})">Edit</button> <button class="btn btn-sm btn-danger" onclick="deleteInventory(${i.id})">Delete</button></td></tr>`; });
}
function showInventoryForm(){ document.getElementById('inventory-form-container').style.display='block'; document.getElementById('inventory-form-title').innerText='Add Inventory Item'; document.getElementById('inventory-form').reset(); document.getElementById('inventoryId').value=''; }
function hideInventoryForm(){ document.getElementById('inventory-form-container').style.display='none'; }
document.getElementById('inventory-form').addEventListener('submit', async e=>{ e.preventDefault(); const id=document.getElementById('inventoryId').value; const item={ id:id?parseInt(id):undefined, name:document.getElementById('inventoryName').value, category:document.getElementById('inventoryCategory').value, quantity:parseInt(document.getElementById('inventoryQuantity').value), price:parseFloat(document.getElementById('inventoryPrice').value) }; await fetch(id?'/inventory/update':'/inventory/add',{ method:id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(item)}); hideInventoryForm(); loadInventory(); });
async function editInventory(id){ const res=await fetch(`/inventory/${id}`); const item=await res.json(); document.getElementById('inventoryId').value=item.id; document.getElementById('inventoryName').value=item.name; document.getElementById('inventoryCategory').value=item.category; document.getElementById('inventoryQuantity').value=item.quantity; document.getElementById('inventoryPrice').value=item.price; document.getElementById('inventory-form-title').innerText='Edit Inventory Item'; document.getElementById('inventory-form-container').style.display='block'; }
async function deleteInventory(id){ if(confirm('Are you sure?')){ await fetch(`/inventory/delete/${id}`,{method:'DELETE'}); loadInventory(); }}

// --------------- OFFERS ----------------
async function loadOffers() {
    const res = await fetch('/offers/all');
    const offers = await res.json();
    const tbody=document.querySelector('#offers-table tbody');
    tbody.innerHTML='';
    offers.forEach(o=>{ tbody.innerHTML+=`<tr><td>${o.id}</td><td>${o.name}</td><td>${o.description}</td><td>${o.discountPercent}%</td><td>${o.startDate}</td><td>${o.endDate}</td><td><button class="btn btn-sm btn-warning" onclick="editOffer(${o.id})">Edit</button> <button class="btn btn-sm btn-danger" onclick="deleteOffer(${o.id})">Delete</button></td></tr>`; });
}
function showOfferForm(){ document.getElementById('offer-form-container').style.display='block'; document.getElementById('offer-form-title').innerText='Add Offer'; document.getElementById('offer-form').reset(); document.getElementById('offerId').value=''; }
function hideOfferForm(){ document.getElementById('offer-form-container').style.display='none'; }
document.getElementById('offer-form').addEventListener('submit', async e=>{ e.preventDefault(); const id=document.getElementById('offerId').value; const offer={ id:id?parseInt(id):undefined, name:document.getElementById('offerName').value, description:document.getElementById('offerDescription').value, discountPercent:parseFloat(document.getElementById('offerDiscount').value), startDate:document.getElementById('offerStartDate').value, endDate:document.getElementById('offerEndDate').value }; await fetch(id?'/offers/update':'/offers/add',{ method:id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(offer)}); hideOfferForm(); loadOffers(); });
async function editOffer(id){ const res=await fetch(`/offers/${id}`); const o=await res.json(); document.getElementById('offerId').value=o.id; document.getElementById('offerName').value=o.name; document.getElementById('offerDescription').value=o.description; document.getElementById('offerDiscount').value=o.discountPercent; document.getElementById('offerStartDate').value=o.startDate; document.getElementById('offerEndDate').value=o.endDate; document.getElementById('offer-form-title').innerText='Edit Offer'; document.getElementById('offer-form-container').style.display='block'; }
async function deleteOffer(id){ if(confirm('Are you sure?')){ await fetch(`/offers/delete/${id}`,{method:'DELETE'}); loadOffers(); }}

// ----------------- INITIAL LOAD -----------------
window.onload = ()=>{
    loadDashboardStats();
    loadFeedback();
    loadInventory();
    loadOffers();
};
</script>
</body>
</html>
