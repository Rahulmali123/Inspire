<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background-color: #f8f9fa; }
.card { border-radius: 15px; }
#login-box { max-width: 400px; margin: 100px auto; }
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="login-box" class="card p-4">
    <h3 class="text-center mb-3">Login</h3>

    <form id="login-form">
        <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
        <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
        <button class="btn btn-primary w-100">Login</button>
    </form>

    <small id="loginError" class="text-danger"></small>
</div>

<!-- ================= DASHBOARD ================= -->
<div class="container mt-5" id="dashboard" style="display:none;">

    <div class="d-flex justify-content-between">
        <h2>CRM Dashboard</h2>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <!-- INVENTORY -->
    <div class="mt-5">
        <h3>Inventory</h3>
        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#inventoryModal">Add Item</button>

        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Name</th><th>Category</th><th>Qty</th><th>Price</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="inventory-body"></tbody>
        </table>
    </div>

    <!-- OFFERS -->
    <div class="mt-5">
        <h3>Offers</h3>
        <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#offerModal">Add Offer</button>

        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Name</th><th>Desc</th><th>%</th><th>Start</th><th>End</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="offer-body"></tbody>
        </table>
    </div>
</div>

<!-- ================= INVENTORY MODAL ================= -->
<div class="modal fade" id="inventoryModal">
<div class="modal-dialog">
<div class="modal-content">
<form id="inventory-form">
<div class="modal-header">
<h5>Inventory</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<input type="hidden" id="invId">
<input class="form-control mb-2" id="invName" placeholder="Name" required>
<input class="form-control mb-2" id="invCategory" placeholder="Category" required>
<input class="form-control mb-2" id="invQty" type="number" placeholder="Quantity" required>
<input class="form-control mb-2" id="invPrice" type="number" placeholder="Price" required>
</div>

<div class="modal-footer">
<button class="btn btn-primary">Save</button>
</div>
</form>
</div>
</div>
</div>

<!-- ================= OFFER MODAL ================= -->
<div class="modal fade" id="offerModal">
<div class="modal-dialog">
<div class="modal-content">
<form id="offer-form">
<div class="modal-header">
<h5>Offer</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<input type="hidden" id="offerId">
<input class="form-control mb-2" id="offerName" placeholder="Name" required>
<textarea class="form-control mb-2" id="offerDesc"></textarea>
<input class="form-control mb-2" id="offerDiscount" type="number" placeholder="Discount" required>
<input class="form-control mb-2" id="offerStart" type="date" required>
<input class="form-control mb-2" id="offerEnd" type="date" required>
</div>

<div class="modal-footer">
<button class="btn btn-success">Save</button>
</div>
</form>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ===== AUTH =====
function authFetch(url, options={}) {
    options.headers = {
        ...(options.headers||{}),
        'Authorization':'Bearer '+localStorage.getItem('jwtToken'),
        'Content-Type':'application/json'
    };
    return fetch(url, options);
}

// ===== LOGIN =====
document.getElementById("login-form").addEventListener("submit", async e=>{
    e.preventDefault();

    const res = await fetch("http://localhost:8080/auth/login", {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    });

    if(!res.ok){
        loginError.innerText="Invalid credentials";
        return;
    }

    const data = await res.json();
    localStorage.setItem("jwtToken", data.token);

    init();
});

// ===== LOGOUT =====
function logout(){
    localStorage.removeItem("jwtToken");
    location.reload();
}

// ===== INIT =====
function init(){
    if(!localStorage.getItem("jwtToken")) return;

    login-box.style.display="none";
    dashboard.style.display="block";

    loadInventory();
    loadOffers();
}

// ===== INVENTORY =====
async function loadInventory(){
    const res = await authFetch("http://localhost:8080/inventory/all");
    const data = await res.json();

    let html="";
    data.forEach(i=>{
        html+=`<tr>
        <td>${i.id}</td>
        <td>${i.name}</td>
        <td>${i.category}</td>
        <td>${i.quantity}</td>
        <td>${i.price}</td>
        <td>
        <button class='btn btn-warning btn-sm' onclick="editInv(${i.id})">Edit</button>
        <button class='btn btn-danger btn-sm' onclick="delInv(${i.id})">Del</button>
        </td>
        </tr>`;
    });

    document.getElementById("inventory-body").innerHTML=html;
}

document.getElementById("inventory-form").addEventListener("submit", async e=>{
    e.preventDefault();

    const id = invId.value;

    const obj={
        id: id||undefined,
        name: invName.value,
        category: invCategory.value,
        quantity: parseInt(invQty.value),
        price: parseFloat(invPrice.value)
    };

    await authFetch(id?"/inventory/update":"/inventory/add",{
        method: id?"PUT":"POST",
        body: JSON.stringify(obj)
    });

    loadInventory();
});

async function delInv(id){
    await authFetch("/inventory/delete/"+id,{method:"DELETE"});
    loadInventory();
}

// ===== OFFERS =====
async function loadOffers(){
    const res = await authFetch("http://localhost:8080/offers/all");
    const data = await res.json();

    let html="";
    data.forEach(o=>{
        html+=`<tr>
        <td>${o.id}</td>
        <td>${o.name}</td>
        <td>${o.description}</td>
        <td>${o.discountPercent}</td>
        <td>${o.startDate}</td>
        <td>${o.endDate}</td>
        <td>
        <button class='btn btn-warning btn-sm' onclick="editOffer(${o.id})">Edit</button>
        <button class='btn btn-danger btn-sm' onclick="delOffer(${o.id})">Del</button>
        </td>
        </tr>`;
    });

    document.getElementById("offer-body").innerHTML=html;
}

document.getElementById("offer-form").addEventListener("submit", async e=>{
    e.preventDefault();

    const id = offerId.value;

    const obj={
        id:id||undefined,
        name: offerName.value,
        description: offerDesc.value,
        discountPercent: parseFloat(offerDiscount.value),
        startDate: offerStart.value,
        endDate: offerEnd.value
    };

    await authFetch(id?"/offers/update":"/offers/add",{
        method:id?"PUT":"POST",
        body: JSON.stringify(obj)
    });

    loadOffers();
});

async function delOffer(id){
    await authFetch("/offers/delete/"+id,{method:"DELETE"});
    loadOffers();
}

// ===== START =====
window.onload=init;

</script>

</body>
</html>
